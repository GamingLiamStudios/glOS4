[package]
name = "glOS"
version = "0.1.0"
edition = "2024"
authors = ["GLStudios <58615717+GamingLiamStudios@users.noreply.github.com>"]
license = "GPL-2.0-only"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true

[dependencies]
acpi = "6.0"
raw-cpuid = "11.6"
x86_64 = "0.15"
pci_types = "0.10"
volatile = "0.6"

spin = "0.10"
bytemuck = "1.24"
num-traits = { version = "0.2", default-features = false }

#rgb = { version = "0.8", features = ["bytemuck"] }
parley = { version = "0.7", default-features = false, features = ["libm"] }
swash = { version = "0.2", default-features = false, features = [
    "libm",
    "render",
] }

rgb = "0.8"
bitvec = { version = "1.0", default-features = false, features = ["alloc"] }

thiserror = { version = "2.0", default-features = false }
nom = { version = "8.0", default-features = false, features = ["alloc"] }

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
perf = "deny"
all = "deny"
